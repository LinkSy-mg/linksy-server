# Local test: plain HTTP on localhost:3340, no certificate, no address discovery.
# docker compose -f compose.dev.yaml up --build

name: linksy-dev

services:
  relay:
    build:
      context: .
      args:
        CONFIG: relay.dev.toml
    image: linksy-server:1.4.0-dev
    command: ["--dev"]
    ports:
      - "127.0.0.1:3340:3340/tcp"
      - "127.0.0.1:9090:9090/tcp"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
