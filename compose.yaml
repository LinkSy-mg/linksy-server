# linksy-server for Dokploy, behind a tunnel: no ports published. It joins
# dokploy-network as `linksy-relay`, listening on 3340 (plain HTTP). In Dokploy, add a
# domain for this service on port 3340 (or point the tunnel at http://linksy-relay:3340).
# Standalone with its own certificate and ports instead: compose.public.yaml.

services:
  relay:
    build:
      context: .
      args:
        CONFIG: relay.tunnel.toml
    image: linksy-server:1.4.0-tunnel
    restart: unless-stopped
    expose:
      - "3340"   # the relay (HTTP / WebSocket); the tunnel adds HTTPS
    networks:
      dokploy-network:
        aliases: [linksy-relay]
    # Hardened: read-only, not root, no capabilities at all, no privilege gain.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    logging:
      driver: local
      options: { max-size: 5m, max-file: "2" }

networks:
  dokploy-network:
    external: true
